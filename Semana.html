<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dias de la semana</title>
</head>
<body>
    <div style="font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; border: 2px solid #333; border-radius: 8px;">
        <h1 style="text-align: center; color: #333;">¿Qué día de la semana es?</h1>
        
        <p style="text-align: center; font-size: 16px;">Ingresa un número del 1 al 7:</p>
        
        <div style="text-align: center; margin: 20px 0;">
            <input 
                type="number" 
                id="numeroDia" 
                min="1" 
                max="7" 
                placeholder="Ingresa un número" 
                style="padding: 10px; font-size: 16px; width: 80%; max-width: 150px; border: 1px solid #ccc; border-radius: 4px;"
            >
        </div>
        
        <div style="text-align: center; margin: 20px 0;">
            <button 
                onclick="obtenerDia()" 
                style="padding: 10px 20px; font-size: 16px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;"
            >
                Obtener día
            </button>
        </div>
        
        <div style="text-align: center; margin-top: 20px; font-size: 18px; font-weight: bold;" id="resultado"></div>
        
        <div style="margin-top: 30px; padding: 15px; background-color: #f0f0f0; border-radius: 4px; font-size: 14px;">
            <p><strong>Guía:</strong></p>
            <ul>
                <li>1 = Lunes</li>
                <li>2 = Martes</li>
                <li>3 = Miércoles</li>
                <li>4 = Jueves</li>
                <li>5 = Viernes</li>
                <li>6 = Sábado</li>
                <li>7 = Domingo</li>
            </ul>
        </div>
    </div>
</body>
<script src="Semana.js"></script>
</html>
