<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro Veterinario</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrapper"> 
    <h2>Alta de Veterinario</h2>
    <form action="/api/v1/usuarios/register" method="post" class="register-form">
        
        <div class="input-group">
            <label for="nombre">Nombre(s)</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="input-group">
            <label for="apellidos">Apellidos</label>
            <input type="text" id="apellidos" name="apellidos" required>
        </div>

        <div class="input-group">
            <label for="edad">Edad</label>
            <input type="number" id="edad" name="edad" min="18" required>
        </div>

        <div class="input-group">
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" required>
        </div>

        <div class="input-group full-width">
            <label for="carrera">Carrera / Título</label>
            <input type="text" id="carrera" name="carrera" placeholder="Ej. Médico Veterinario" required>
        </div>

        <div class="input-group full-width">
            <label for="especialidad">Especialidad (Opcional)</label>
            <input type="text" id="especialidad" name="especialidad" placeholder="Ej. Cirugía, Dermatología...">
        </div>

        <div class="input-group full-width">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div class="input-group">
            <label for="confirmarPassword">Confirmar Contraseña</label>
            <input type="password" id="confirmarPassword" name="confirmarPassword" required>
        </div>

        <button type="submit" class="btn full-width" style="margin-top: 15px;">Dar de alta Veterinario</button>
        
        <p class="register-link full-width" style="text-align: center; margin-top: 5px;">
            ¿Ya tienes cuenta? <a href="/login.html" style="color: #fff; font-weight: 600;">Inicia sesión</a>
        </p>
    </form>
  </div>
</body>
</html>
