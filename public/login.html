<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles.css"> 
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <title>Login Veterinarios - Paws & Cross</title>
</head>
<body>
    <div class="wrapper">
        <form id="login-form" action="/api/v1/usuarios/login" method="post">
            <h1>Inicio de sesión</h1>
            <div class="input-box">
                <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
                <i class='bx bx-user'></i>
            </div>
            <div class="input-box">
                <input type="password" name="password" placeholder="Contraseña" required>
                <i class='bx bx-lock-alt'></i>
            </div>
            <div class='remember-forgot'>
                <input type="checkbox" id="recordar" name="recordar">
                <label for="recordar">Recordar</label>
            </div>
            <button type="submit" class="btn">Iniciar sesión</button>
            <div class="login-register">
                <p>¿No tienes una cuenta? <a href="/logindto.html">Regístrate</a></p>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const emailInput = document.getElementById('email');
            const recordarCheckbox = document.getElementById('recordar');
            const loginForm = document.getElementById('login-form');

            if (!emailInput || !recordarCheckbox || !loginForm) return;

            const correoGuardado = localStorage.getItem('correoVeterinario');
            if (correoGuardado) {
                emailInput.value = correoGuardado; 
                recordarCheckbox.checked = true;   
            }

            loginForm.addEventListener('submit', () => {
                if (recordarCheckbox.checked) {
                    localStorage.setItem('correoVeterinario', emailInput.value);
                } else {
                    localStorage.removeItem('correoVeterinario');
                }
            });
        });
    </script>
</body>
</html>
